[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nadir-sdk"
version = "0.1.1"
description = "Python SDK for the Nadir LLM router: picks the right model and effort for each request"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "Nadir", email = "info@getnadir.com"}]
keywords = ["nadir", "llm", "router", "openai", "anthropic", "ai", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://getnadir.com"
Documentation = "https://getnadir.com/docs"
Repository = "https://github.com/NadirRouter/nadir-python"
Issues = "https://github.com/NadirRouter/nadir-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-httpx>=0.30.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["nadir*"]
